  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

t:52px;border-radius:12px;border:0;background:#8E4636;color:#FBF8F4;font:600 15px 'Hanken Grotesk',sans-serif;cursor:pointer\" style-active=\"background:#77382B\">{{ payLabel }}<\u002Fbutton>\n<p style=\"margin:0;text-align:center;font-size:10.5px;line-height:1.4;color:#6B635A\">Free delivery · 10–50 days · Import duty payable on arrival<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;dataSaver&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Network&quot;},&quot;startPage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;feed&quot;,&quot;options&quot;:[&quot;feed&quot;,&quot;product&quot;,&quot;browse&quot;,&quot;delivery&quot;,&quot;checkout&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Preview&quot;}}\">\nconst PRODUCTS = [\n  {id:'glidecord',label:'01 GlideCord',title:'GlideCord cordless straightening brush',price:369,media:'video',videoSize:'4 MB',mediaNote:'9:16 video · 4C hair demo',hookPlain:'Cordless.',hookAccent:'Straightens 4C.',caption:'Rechargeable, so it works anywhere there is no socket. Shown here on 4C hair.',addon:{name:'SilkRepair hair mask',price:129},href:'/products/glidecord-cordless-straightening-brush'},\n  {id:'waveshift',label:'02 WaveShift',title:'WaveShift 2-in-1 straightener & curling iron',price:439,was:549,media:'image',placeholder:'WaveShift product photo (square)',hookPlain:'Straight today.',hookAccent:'Curls tomorrow.',caption:'One barrel, two finishes. The first product ever ordered from Presura in Accra.',addon:{name:'SilkRoot oil',price:119},href:'/products/waveshift-2-in-1'},\n  {id:'velvettouch',label:'03 VelvetTouch',title:'VelvetTouch painless facial hair remover',price:199,media:'video',videoSize:'3 MB',mediaNote:'9:16 video · brow demo',hookPlain:'Brows, upper lip, chin.',hookAccent:'Painless.',caption:'Rechargeable. Shown here on brows and upper lip.',variants:['Rechargeable · Pink','Rechargeable · White'],addon:{name:'SlimLine trimmer',price:209},href:'/products/velvettouch-facial-hair-remover'},\n  {id:'massage',label:'04 4-Mode massager',title:'4-Mode facial massage & serum infusion device',price:239,media:'image',placeholder:'4-Mode device photo (square)',hookPlain:'Four modes.',hookAccent:'One face.',caption:'Vibration, warm, cool and light modes, with serum infusion.',rating:{value:4.7,count:15},addon:{name:'Snail Essence cream',price:199},href:'/products/4-mode-facial-massage-device'},\n  {id:'sleekcomb',label:'05 SleekComb',title:'SleekComb 2-in-1 hot comb',price:369,media:'image',placeholder:'SleekComb photo (square)',hookPlain:'The hot comb,',hookAccent:'UK plug.',caption:'Hot comb and straightener in one. Ships with a UK plug by default.',variants:['UK plug','EU plug','US plug'],addon:{name:'SilkRoot oil',price:119},href:'/products/sleekcomb-hot-comb'},\n  {id:'silkmist',label:'06 SilkMist',title:'SilkMist conditioning spray brush',price:239,media:'image',placeholder:'SilkMist photo (square)',hookPlain:'Mist and detangle',hookAccent:'in one pass.',caption:'Conditioning spray built into the brush head.',addon:{name:'SilkRepair hair mask',price:129},href:'/products/silkmist-spray-brush'}\n];\nconst SPECS = {\n  glidecord:[{k:'Power',v:'Rechargeable, cordless'},{k:'Demo hair type',v:'4C'},{k:'Pairs with',v:'SilkRepair hair mask'}],\n  waveshift:[{k:'Finishes',v:'Straight and curls'},{k:'Barrel',v:'One, 2-in-1'},{k:'Pairs with',v:'SilkRoot oil'}],\n  velvettouch:[{k:'Power',v:'Rechargeable'},{k:'Areas',v:'Brows, upper lip, chin'},{k:'Colour',v:'Pink'},{k:'Pairs with',v:'SlimLine trimmer'}],\n  massage:[{k:'Modes',v:'4'},{k:'Serum infusion',v:'Yes'},{k:'Pairs with',v:'Snail Essence cream'}],\n  sleekcomb:[{k:'Plug',v:'UK (default)'},{k:'Function',v:'Hot comb and straightener'},{k:'Pairs with',v:'SilkRoot oil'}],\n  silkmist:[{k:'Spray',v:'Conditioning, in the brush head'},{k:'Pairs with',v:'SilkRepair hair mask'}]\n};\nconst ADDONS = [\n  {id:'silkrepair',title:'SilkRepair hair mask',price:129,cat:'Hair care',href:'/products/silkrepair-hair-mask'},\n  {id:'silkroot',title:'SilkRoot oil',price:119,cat:'Hair care',href:'/products/silkroot-oil'},\n  {id:'slimline',title:'SlimLine trimmer',price:209,cat:'Face',href:'/products/slimline-trimmer'},\n  {id:'snail',title:'Snail Essence cream',price:199,cat:'Face',href:'/products/snail-essence-cream'}\n];\nconst CATEGORIES = [\n  {name:'Skin & Light Therapy',count:18,handle:'skin-light-therapy'},\n  {name:'Body & Massage',count:13,handle:'body-massage'},\n  {name:'Home, Pet & Bath',count:12,handle:'home-pet-bath'},\n  {name:'Fans & Cooling',count:9,handle:'fans-cooling'},\n  {name:'Hair & Styling',count:9,handle:'hair-styling'},\n  {name:'Hair Removal',count:6,handle:'hair-removal'},\n  {name:'Lips & Beauty',count:6,handle:'lips-beauty'},\n  {name:'Lighting & Ambience',count:5,handle:'lighting-ambience'}\n];\nconst CATS = {glidecord:'Hair & Styling',waveshift:'Hair & Styling',velvettouch:'Hair Removal',massage:'Skin & Light Therapy',sleekcomb:'Hair & Styling',silkmist:'Hair & Styling',silkrepair:'Hair & Styling',silkroot:'Hair & Styling',slimline:'Hair Removal',snail:'Skin & Light Therapy'};\nconst FILTERS = ['All'].concat(CATEGORIES.map(c => c.name));\nconst REGIONS = ['Greater Accra','Ashanti','Western','Central','Eastern','Volta','Northern','Bono','Other region'];\nconst PAY = [\n  {id:'momo',name:'MTN Mobile Money',badge:'MTN MoMo',badgeBg:'#FFCC00',badgeColor:'#1C1917'},\n  {id:'visa',name:'Visa card',badge:'VISA',badgeBg:'#1A1F71',badgeColor:'#fff'},\n  {id:'mc',name:'Mastercard',badge:'Mastercard',badgeBg:'#1C1917',badgeColor:'#fff'}\n];\nconst ghs = n => 'GH₵' + n.toFixed(2).replace(/\\B(?=(\\d{3})+(?!\\d))/g, ',');\n\nclass Component extends DCLogic {\n  state = { index:0, muted:true, drawerOpen:false, sheetOpen:false, bag:[], addons:{}, variants:{}, played:{}, view:'feed', productId:null, filter:'All', pay:'momo' };\n  feedRef = React.createRef();\n  go(view, extra) { return e => { if (e && e.preventDefault) e.preventDefault(); this.setState({view, drawerOpen:false, sheetOpen:false, ...(extra || {})}); }; }\n\n  onScroll = e => {\n    const el = e.currentTarget, i = Math.round(el.scrollTop / el.clientHeight);\n    if (i !== this.state.index) this.setState({index:i});\n  };\n  addLine(bag, name, meta, price) {\n    const key = name + '|' + meta, ex = bag.find(b => b.key === key);\n    return ex ? bag.map(b => b.key === key ? {...b, qty:b.qty + 1} : b) : [...bag, {key, name, meta, price, qty:1}];\n  }\n\n  renderVals() {\n    const {index, muted, drawerOpen, bag, addons, variants, played} = this.state;\n    const dataSaver = this.props.dataSaver ?? false;\n    const productSlides = PRODUCTS.map(p => {\n      const addonChecked = !!addons[p.id];\n      const variant = variants[p.id] ?? (p.variants ? p.variants[0] : null);\n      const total = p.price + (addonChecked ? p.addon.price : 0);\n      const saverBlocked = p.media === 'video' && dataSaver && !played[p.id];\n      return {\n        ...p, isProduct:true, isRange:false, isVideo:p.media === 'video', isImage:p.media === 'image', slotId:'slot-' + p.id, pageSlotId:'page-' + p.id,\n        specs:SPECS[p.id], placeholder:p.placeholder || (p.title.split(' ')[0] + ' product photo (square)'),\n        openProduct:this.go('product', {productId:p.id}),\n        saverBlocked, saverOpen:!saverBlocked,\n        priceLabel:ghs(p.price), hasWas:!!p.was, wasLabel:p.was ? ghs(p.was) : '',\n        showRating:!!p.rating, rating:p.rating ? p.rating.value.toFixed(1) : '', reviewCount:p.rating ? p.rating.count : 0,\n        stars:'★★★★★', hasVariants:!!p.variants, variant, addonChecked,\n        addonName:p.addon.name, addonPriceLabel:ghs(p.addon.price), totalLabel:ghs(total),\n        toggleAddon:() => this.setState(s => ({addons:{...s.addons, [p.id]:!s.addons[p.id]}})),\n        setVariant:e => { const v = e.target.value; this.setState(s => ({variants:{...s.variants, [p.id]:v}})); },\n        play:() => this.setState(s => ({played:{...s.played, [p.id]:true}})),\n        share:() => {\n          const url = 'https://presuraaf.shop' + p.href + '?utm_source=whatsapp&utm_medium=share';\n          const text = p.title + ' · ' + ghs(p.price) + ' · ' + url;\n          if (navigator.share) navigator.share({title:p.title, text, url}).catch(() => {});\n          else window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');\n        },\n        addToBag:() => this.setState(s => {\n          let b = this.addLine(s.bag, p.title, variant ?? 'Standard', p.price);\n          if (addonChecked) b = this.addLine(b, p.addon.name, 'Paired add-on', p.addon.price);\n          return {bag:b, drawerOpen:true};\n        })\n      };\n    });\n    const slides = [...productSlides.slice(0, 2), {id:'range', label:'03 The range', isRange:true, isProduct:false, isVideo:false, isImage:false}, ...productSlides.slice(2)];\n    const categories = CATEGORIES.map(c => ({...c, slotId:'cat-' + c.handle, sheetSlotId:'sheet-' + c.handle, href:'/collections/' + c.handle,\n      countLabel:c.count + ' products', placeholder:'First product photo · ' + c.name,\n      open:e => { e.preventDefault(); this.setState({view:'browse', filter:c.name, sheetOpen:false, drawerOpen:false}); }}));\n    const bagCount = bag.reduce((n, b) => n + b.qty, 0);\n    const bagTotal = bag.reduce((n, b) => n + b.qty * b.price, 0);\n    const bagView = bag.map(b => ({...b, lineLabel:ghs(b.qty * b.price),\n      inc:() => this.setState(s => ({bag:s.bag.map(x => x.key === b.key ? {...x, qty:x.qty + 1} : x)})),\n      dec:() => this.setState(s => ({bag:s.bag.map(x => x.key === b.key ? {...x, qty:x.qty - 1} : x).filter(x => x.qty > 0)}))\n    }));\n    const n = slides.length;\n    const {productId, filter, pay} = this.state;\n    const start = this.props.startPage ?? 'feed';\n    if (start !== this.lastStart) { this.lastStart = start; if (start !== 'feed') Promise.resolve().then(() => this.setState({view:start})); }\n    const view = this.state.view;\n    const product = productSlides.find(s => s.id === productId) || productSlides[0];\n    const all = [...PRODUCTS.map(p => ({...p, cat:CATS[p.id]})), ...ADDONS];\n    const catalogue = all.filter(c => filter === 'All' || c.cat === filter).map(c => {\n      const isMain = !!SPECS[c.id];\n      return {...c, short:c.title, priceLabel:ghs(c.price), hasWas:!!c.was, wasLabel:c.was ? ghs(c.was) : '',\n        open:isMain ? this.go('product', {productId:c.id}) : (e => e.preventDefault())};\n    });\n    const filters = FILTERS.map(f => { const on = f === filter; return {name:f, pick:() => this.setState({filter:f}),\n      border:on ? '#8E4636' : 'rgba(28,25,23,.18)', bg:on ? '#8E4636' : '#FBF8F4', color:on ? '#FBF8F4' : '#1C1917'}; });\n    const payOptions = PAY.map(o => { const on = o.id === pay; return {...o, pick:() => this.setState({pay:o.id}),\n      border:on ? '#8E4636' : 'rgba(28,25,23,.15)', bg:on ? 'rgba(142,70,54,.06)' : '#FFF', dot:on ? '#8E4636' : 'rgba(28,25,23,.35)', dotFill:on ? '#8E4636' : 'transparent'}; });\n    const pageLabels = {product:'Product', browse:'All products', delivery:'Delivery & returns', checkout:'Checkout'};\n    return {\n      slides, feedRef:this.feedRef, onScroll:this.onScroll,\n      pageOpen:view !== 'feed', pageLabel:pageLabels[view] || '', closePage:this.go('feed'),\n      isProductPage:view === 'product', isBrowsePage:view === 'browse', isDeliveryPage:view === 'delivery', isCheckoutPage:view === 'checkout',\n      openBrowse:this.go('browse'), openDelivery:this.go('delivery'), openCheckout:this.go('checkout'),\n      product, catalogue, catalogueEmpty:catalogue.length === 0, catalogueShown:all.length, catalogueRest:69 - all.length, filters, regions:REGIONS,\n      categories, sheetOpen:this.state.sheetOpen, openSheet:() => this.setState({sheetOpen:true}), closeSheet:() => this.setState({sheetOpen:false}),\n      payOptions, payIsMomo:pay === 'momo', payIsCard:pay !== 'momo',\n      payLabel:(pay === 'momo' ? 'Pay with MoMo · ' : 'Pay by card · ') + ghs(bagTotal),\n      counterLabel:Math.min(index + 1, n) + ' / ' + n,\n      muted, unmuted:!muted, toggleMute:() => this.setState(s => ({muted:!s.muted})),\n      bag:bagView, bagCount, hasBag:bagCount > 0, bagEmpty:bagCount === 0, bagTotalLabel:ghs(bagTotal),\n      drawerOpen, openDrawer:() => this.setState({drawerOpen:true}), closeDrawer:() => this.setState({drawerOpen:false}),\n      backToTop:() => { const el = this.feedRef.current; if (el) el.scrollTo({top:0, behavior:'smooth'}); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
