<!DOCTYPE html>
<html lang="en">
<head>
<title>Shop all — VALENOR</title>
<meta name="description" content="VALENOR storefront demo: shop the collection.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e0d0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 fill=%22%230e0d0b%22/%3E%3Ctext x=%2232%22 y=%2244%22 text-anchor=%22middle%22 font-family=%22Georgia,serif%22 font-size=%2236%22 fill=%22%23c2a878%22%3EV%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="shop">
<main>
  <section class="shop-hero dark">
    <div class="wrap">
      <span class="eyebrow">Collection</span>
      <h1 class="display" id="shop-title">Shop <em>all</em></h1>
      <p class="lede" id="shop-lede"></p>
      <nav class="tabs" id="tabs" aria-label="Categories"></nav>
    </div>
  </section>
  <section class="wrap" style="padding-bottom:90px">
    <div class="toolbar">
      <span class="toolbar__count" id="count"></span>
      <div class="toolbar__right">
        <label class="toggle"><input type="checkbox" id="mine"><span id="mine-label">Only my size</span></label>
        <button class="link-arrow" id="fit-open" style="letter-spacing:.2em">Fit profile</button>
        <label class="sr-only" for="sort">Sort by</label>
        <select class="select" id="sort"><option value="featured">Featured</option><option value="new">Newest</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select>
      </div>
    </div>
    <div class="grid" id="shop-grid"></div>
  </section>
</main>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
